services:
  - type: web
    name: fraudvision
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 1
